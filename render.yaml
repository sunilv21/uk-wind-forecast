services:
  - type: web
    name: uk-wind-forecast-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        sync: false          # set manually in Render dashboard after Vercel URL is known
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_RETRIES
        value: "3"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: CACHE_TTL_HISTORICAL
        value: "3600"
      - key: MAX_TREND_DAYS
        value: "30"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "30"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wind_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ELEXON_BASE_URL=${ELEXON_BASE_URL:-https://data.elexon.co.uk/bmrs/api/v1}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://frontend}
      - REQUEST_TIMEOUT_SECONDS=${REQUEST_TIMEOUT_SECONDS:-30}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - CACHE_TTL_HISTORICAL=${CACHE_TTL_HISTORICAL:-3600}
      - MAX_TREND_DAYS=${MAX_TREND_DAYS:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - UK_INSTALLED_WIND_MW=${UK_INSTALLED_WIND_MW:-30000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: wind_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  default:
    name: wind_network
